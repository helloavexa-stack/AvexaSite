<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEXA | 404 Not Found</title>
  <meta name="title" content="AVEXA | 404 Not Found">
  <meta name="description" content="The page you are looking for does not exist.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="canonical" href="https://avexahq.com/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- Brand Colors & Variables --- */
    :root {
      --black: #0A0A0A;
      --white: #FFFFFF;
      --off-white: #FAFAFA;
      --light-gray: #F3F4F6;
      --medium-gray: #6B7280;
      --dark-gray: #1F2937;
      --border-gray: #E5E7EB;
      --electric-blue: #2563EB;
      --error-red: #e74c3c;
    }

    /* --- Global Styles --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--black);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--black), var(--dark-gray), var(--black));
      background-size: 200% 200%;
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      animation: backgroundPan 15s ease infinite, fadeInPage 0.5s ease-out forwards;
    }

    body.fade-out {
      animation: backgroundPan 15s ease infinite, fadeOutPage 0.4s ease-in forwards;
    }

    @keyframes fadeInPage {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes fadeOutPage {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    /* --- Layout & Containers --- */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      text-align: center;
      z-index: 10;
    }

    /* --- Typography & Elements --- */
    .error-code {
      font-weight: 700;
      font-size: 8rem;
      color: var(--white);
      text-shadow: 4px 4px 0 var(--error-red);
      margin-bottom: 0;
      line-height: 1;
      animation: float 6s ease-in-out infinite;
    }

    .error-message {
      font-weight: 600;
      font-size: 1.5rem;
      color: var(--light-gray);
      margin-top: 1rem;
      margin-bottom: 2rem;
      animation: introFadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      opacity: 0;
      animation-delay: 0.3s;
    }

    /* --- Buttons --- */
    .btn {
      display: inline-block;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      border-radius: 4px;
      border: 3px solid transparent;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      z-index: 1;
      animation: introFadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      opacity: 0;
      animation-delay: 0.6s;
    }

    .btn-primary {
      background-color: var(--white);
      color: var(--black);
      border-color: var(--white);
      box-shadow: 4px 4px 0 var(--error-red);
    }

    .btn-primary:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--error-red);
    }

    /* Environmental Animations */
    @keyframes backgroundPan {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    @keyframes introFadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Particles */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      animation: floatParticle 10s infinite linear;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    /* --- Footer --- */
    footer {
      width: 100%;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--medium-gray);
      z-index: 10;
    }

    footer a {
      color: var(--medium-gray);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: var(--white);
    }
  </style>
</head>

<body>

  <div class="particles">
    <div class="particle" style="width: 50px; height: 50px; left: 10%; animation-duration: 12s;"></div>
    <div class="particle" style="width: 30px; height: 30px; left: 30%; animation-duration: 15s; animation-delay: 2s;"></div>
    <div class="particle" style="width: 70px; height: 70px; left: 70%; animation-duration: 10s; animation-delay: 1s;"></div>
    <div class="particle" style="width: 40px; height: 40px; left: 85%; animation-duration: 14s; animation-delay: 4s;"></div>
  </div>

  <main class="main-content">
    <h1 class="error-code">404</h1>
    <h2 class="error-message">Oops! You've wandered off the path.</h2>

    <div class="button-group">
      <a href="/home/" class="btn btn-primary">Return to Home</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 AVEXA. All rights reserved.</p>
    <p>
      <a href="/home/#privacy">Privacy Policy</a> |
      <a href="/home/#terms">Terms of Service</a>
    </p>
  </footer>

  <script>
    // Vanilla JS Page Transitions
    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link && link.href && link.target !== '_blank' && link.href.startsWith(window.location.origin)) {
        const url = new URL(link.href);
        if (url.pathname === window.location.pathname && url.hash) {
          return;
        }

        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location = link.href;
        }, 350);
      }
    });
  </script>
</body>

</html>
