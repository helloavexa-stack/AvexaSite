  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- Brand Colors & Variables --- */
    :root {
      --black: #0A0A0A;
      --white: #FFFFFF;
      --off-white: #FAFAFA;
      --light-gray: #F3F4F6;
      --medium-gray: #6B7280;
      --dark-gray: #1F2937;
      --border-gray: #E5E7EB;
      --electric-blue: #2563EB;
    }

    /* --- Global Styles --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--black);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--black), var(--dark-gray), var(--black));
      background-size: 200% 200%;
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      animation: backgroundPan 15s ease infinite, fadeInPage 0.5s ease-out forwards;
    }

    body.fade-out {
      animation: backgroundPan 15s ease infinite, fadeOutPage 0.4s ease-in forwards;
    }

    @keyframes fadeInPage {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeOutPage {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    /* --- Layout & Containers --- */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      text-align: center;
      z-index: 10;
    }

    /* --- Logo Styles & Reveal Animation --- */
    .logo-container {
      position: relative;
      /* The floating idle animation kicks in after the reveal sequence finishes */
      animation: float 6s ease-in-out infinite;
      animation-delay: 1.5s;
    }

    .reveal-line {
      position: absolute;
      bottom: 15%;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--electric-blue);
      transform: scaleX(0);
      transform-origin: center;
      animation: lineZoom 0.6s ease-out forwards;
      z-index: 2;

      /* --- FIXES BELOW --- */
      box-shadow: none !important;
      filter: none !important;

      /* Forces hardware acceleration and stops browser edge-blurring/shadow artifacts during the scale animation */
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      outline: 1px solid transparent;
    }

    .logo-reveal-wrapper {
      /* Hides everything (including the shadow) initially */
      opacity: 0;
      clip-path: inset(100% -50px -50px -50px);
      transform: translateY(30px);
      animation: logoRevealUp 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      animation-delay: 0.6s;
      /* Starts right as the line finishes drawing */
    }

    .logo-container img {
      max-width: 550px;
      /* Made the logo significantly larger */
      width: 100%;
      height: auto;
      display: block;
      /* Permanent, clean drop-shadow now safely contained within wrapper opacity control */
      filter: drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.9));
    }

    /* 2. Wrapper slides up, clips open, and fades in smoothly with its shadow */
    @keyframes logoRevealUp {
      0% {
        opacity: 0;
        clip-path: inset(100% -50px -50px -50px);
        transform: translateY(30px);
      }

      50% {
        opacity: 1;
        /* Fades the shadow and logo in quickly as it breaks the threshold */
      }

      100% {
        opacity: 1;
        clip-path: inset(-50px -50px -50px -50px);
        transform: translateY(0);
      }
    }

    /* --- Typography & Typing Effect --- */
    .typing-wrapper {
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    h2.typewriter {
      font-weight: 600;
      font-size: 1.5rem;
      color: var(--light-gray);
      overflow: hidden;
      /* Ensures text is hidden before typing */
      white-space: nowrap;
      margin: 0 auto;
      border-right: 3px solid var(--electric-blue);
      /* Cursor */
      width: 0;
      opacity: 0;
      /* Typing sequence begins after logo reveal is fully completed */
      animation:
        startTyping 0.1s forwards 1.4s,
        typing 1.2s steps(40, end) forwards 1.4s,
        blink-caret 0.75s step-end infinite;
    }

    /* --- Buttons/Links (Staggered Reveal) --- */
    .button-group {
      display: flex;
      gap: 1rem;
      opacity: 0;
      transform: translateY(20px);
      /* Fades in right after the typing effect finishes */
      animation: introFadeUp 0.8s ease forwards;
      animation-delay: 2.8s;
    }

    .btn {
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-primary {
      background-color: var(--electric-blue);
      color: var(--white);
      border: 1px solid var(--electric-blue);
      animation: pulseGlow 2.5s infinite;
    }

    .btn-primary:hover {
      background-color: var(--white);
      color: var(--electric-blue);
      transform: translateY(-2px);
      animation: none;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--white);
      border: 1px solid var(--border-gray);
    }

    .btn-secondary:hover {
      background-color: var(--dark-gray);
      border-color: var(--white);
      transform: translateY(-2px);
    }

    /* --- Footer (Staggered Reveal) --- */
    footer {
      width: 100%;
      padding: 1.5rem;
      text-align: center;
      border-top: 1px solid rgba(229, 231, 235, 0.1);
      opacity: 0;
      transform: translateY(20px);
      /* Final element to appear */
      animation: introFadeUp 0.8s ease forwards;
      animation-delay: 3.2s;
    }

    footer p,
    footer a {
      font-size: 0.875rem;
      color: var(--medium-gray);
      text-decoration: none;
      margin: 0 10px;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: var(--white);
    }

    /* --- Keyframe Animations --- */

    /* 1. Line draws outward from center */
    @keyframes lineZoom {
      0% {
        transform: scaleX(0);
        opacity: 1;
      }

      80% {
        transform: scaleX(1.1);
        opacity: 1;
      }

      100% {
        transform: scaleX(1);
        opacity: 0;
      }

      /* Vanishes as logo completes reveal */
    }

    /* 3. Typing effect mechanisms */
    @keyframes startTyping {
      to {
        opacity: 1;
      }
    }

    @keyframes typing {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    @keyframes blink-caret {
      50% {
        border-color: transparent;
      }
    }

    /* 4. General staggered fade up for content below */
    @keyframes introFadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Environmental Animations */
    @keyframes backgroundPan {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6);
      }

      70% {
        box-shadow: 0 0 0 12px rgba(37, 99, 235, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
      }
    }

    /* Particles */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      animation: floatParticle 10s infinite linear;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    /* --- Page Transitions --- */
    @media (prefers-reduced-motion: no-preference) {
      @view-transition {
        navigation: auto;
      }
    }
  </style>
</head>

<body>

  <div class="particles">
    <div class="particle" style="width: 50px; height: 50px; left: 10%; animation-duration: 12s;"></div>
    <div class="particle" style="width: 30px; height: 30px; left: 30%; animation-duration: 15s; animation-delay: 2s;">
    </div>
    <div class="particle" style="width: 70px; height: 70px; left: 70%; animation-duration: 10s; animation-delay: 1s;">
    </div>
    <div class="particle" style="width: 40px; height: 40px; left: 85%; animation-duration: 14s; animation-delay: 4s;">
    </div>
  </div>

  <main class="main-content">
    <!-- Logo Sequence -->
    <div class="logo-container">
      <div class="reveal-line"></div>
      <div class="logo-reveal-wrapper">
        <img src="/AVEXA LOGO (11).png" alt="AVEXA Logo">
      </div>
    </div>

    <!-- Typing Effect -->
    <div class="typing-wrapper">
      <h2 class="typewriter">Delegate Smarter. Grow Faster.</h2>
    </div>

    <!-- Staggered Buttons -->
    <div class="button-group">
      <a href="/b2b/" class="btn btn-primary">Business to Business</a>
      <a href="/gethired/" class="btn btn-secondary">Join US!</a>
    </div>
  </main>

  <!-- Staggered Footer -->
  <footer>
    <p>&copy; 2026 AVEXA. All rights reserved.</p>
    <p>
      <a href="/privacy/">Privacy Policy</a> |
      <a href="/terms/">Terms of Service</a>
    </p>
  </footer>

  <script>
    // Vanilla JS Page Transitions
    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      // Check if it's an internal link
      if (link && link.href && link.target !== '_blank' && link.href.startsWith(window.location.origin)) {
        // Check if it's just an anchor link on the same page
        const url = new URL(link.href);
        if (url.pathname === window.location.pathname && url.hash) {
          return; // let default browser anchor scroll happen
        }

        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location = link.href;
        }, 350); // wait for animation
      }
    });
  </script>
</body>
